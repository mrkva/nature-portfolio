<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonáš Gruska — Nature photography</title>
<meta name="description" content="Photographs of fungi, lichens, slime molds and small animals from around the world by Jonáš Gruska. Every observation is documented on iNaturalist.">
<link rel="preconnect" href="https://inaturalist-open-data.s3.amazonaws.com" crossorigin>
<link rel="dns-prefetch" href="https://inaturalist-open-data.s3.amazonaws.com">
<style>
  html,body{margin:0;height:100%;background:#fff;color:#111;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  a{color:#111}a:hover{color:#777}
  button{font-family:inherit;font-size:13px;color:#111;background:#fff;border:0;cursor:pointer;padding:0;text-align:left}
  button:hover{background:#f2f2f2}
  button.on,button.on:hover{background:#111;color:#fff}
  @keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}

  #app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#fff}
  header{display:grid;grid-template-columns:minmax(160px,auto) 1fr auto;gap:1px;background:#111;border-bottom:1px solid #111}
  .brand{display:grid;grid-template-rows:1fr auto;gap:1px;background:#111}
  .brand .name{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:6px 16px;white-space:nowrap;line-height:1.2}
  .brand .name b{font-size:14px;font-weight:700;letter-spacing:.02em}
  .brand .name span{font-size:8px;color:#777;text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
  .brand .name.on span{color:#aaa}
  .brand .pages{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#111}
  .brand .pages button{height:26px;padding:0 16px;font-size:12px}
  nav{display:flex;flex-wrap:wrap;background:#fff;align-content:stretch;overflow:hidden;margin:0 -1px -1px 0}
  nav button{min-height:34px;padding:0 16px;box-shadow:0 0 0 1px #111;margin:0 1px 1px 0;flex:1 0 auto;justify-content:center;display:flex;align-items:center;gap:8px}
  nav button small{font-size:10px;opacity:.55;font-variant-numeric:tabular-nums}
  .tools{display:flex;gap:1px;background:#111;align-items:stretch}
  .tools .counter{min-height:34px;padding:0 16px;display:flex;align-items:center;gap:12px;background:#fff;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tools .counter:empty{display:none}
  .tools .counter button{width:22px;height:22px;border:1px solid #111;display:grid;place-items:center;font-size:9px}
  .tools .counter button:hover{background:#111;color:#fff}
  .tools > button{min-height:34px;padding:0 16px}

  main{position:relative;min-height:0;overflow:hidden}
  .msg{position:absolute;inset:0;display:grid;place-items:center;padding:40px;text-align:center;font-size:13px;color:#777;line-height:1.6}
  .msg.loading{animation:breathe 2.4s ease-in-out infinite;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
  .msg b{color:#111}
  #stage{position:absolute;inset:0;overflow:hidden;background:#fff}
  .layer{position:absolute;inset:0;transition:opacity 1.2s ease}
  .layer.instant{transition:none}
  .layer.out{opacity:0}
  .layer .bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(36px) brightness(.72) saturate(.8)}
  .layer .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
  .hit{position:absolute;top:0;bottom:0;width:25%;background:transparent;z-index:1}
  .hit:hover{background:transparent}
  #prev{left:0;cursor:w-resize}#next{right:0;cursor:e-resize}
  .page{position:absolute;inset:0;overflow-y:auto;padding:48px 16px;box-sizing:border-box}
  .page .txt{max-width:560px;font-size:16px;line-height:1.55;white-space:pre-line}
  .page .eq{max-width:560px;margin-top:32px}
  .page .eq label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#777;margin-bottom:6px}
  .page .eq ul{list-style:none;margin:0;padding:0;font-size:16px;line-height:1.55}
  .page .links{max-width:560px;font-size:16px;line-height:1.55;display:grid;gap:12px}
  .page a{text-decoration:underline;text-underline-offset:3px}
  #grid{position:absolute;inset:0;overflow-y:auto}
  #grid .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:#111;border-bottom:1px solid #111}
  #grid button{position:relative;aspect-ratio:1;overflow:hidden;display:block}
  #grid img{width:100%;height:100%;object-fit:cover;display:block}
  #grid span{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:#fff;border-top:1px solid #111;font-size:11px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  footer{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;border-top:1px solid #111;background:#111}
  footer div{padding:10px 16px;min-width:0;background:#fff}
  footer label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#777;margin-bottom:4px}
  footer p{margin:0;font-size:14px;line-height:1.3}
  footer p.i{font-style:italic}
  footer p.n{font-variant-numeric:tabular-nums}
  footer a{text-decoration:underline;text-underline-offset:3px}
  [hidden]{display:none!important}
  @media (max-width:720px){
    header{grid-template-columns:1fr auto}
    nav{grid-column:1/-1}
    .brand .name{padding:8px 12px}
    footer{grid-template-columns:repeat(2,1fr)}
    .page{padding:24px 12px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <button class="name" id="btnHome"><b id="ownerName"></b><span id="subtitle"></span></button>
      <div class="pages">
        <button id="btnAbout">About</button>
        <button id="btnContact">Contact</button>
      </div>
    </div>
    <nav id="cats"></nav>
    <div class="tools">
      <div class="counter" id="counter"></div>
      <button id="btnSlides">Slideshow</button>
      <button id="btnGrid">Grid</button>
    </div>
  </header>

  <main>
    <div class="msg loading" id="loading">Loading</div>
    <div class="msg" id="empty" hidden><div style="max-width:420px">Nothing here yet. Tag observations on iNaturalist with <b id="tagName"></b> and they will appear after the next build.</div></div>
    <div id="slides" hidden>
      <div id="stage"></div>
      <button class="hit" id="prev" aria-label="Previous"></button>
      <button class="hit" id="next" aria-label="Next"></button>
    </div>
    <div class="page" id="about" hidden><div class="txt" id="aboutText"></div><div class="eq"><label>Equipment</label><ul id="equipment"></ul></div></div>
    <div class="page" id="contact" hidden>
      <div class="links">
        <a id="mail" href="#"></a>
        <a id="inatLink" href="#" target="_blank" rel="noopener">iNaturalist ↗</a>
      </div>
    </div>
    <div id="grid" hidden><div class="cells" id="cells"></div></div>
  </main>

  <footer id="footer" hidden>
    <div><label>Species</label><p class="i" id="fLatin"></p></div>
    <div><label>English</label><p id="fEn"></p></div>
    <div><label>Slovak</label><p id="fSk"></p></div>
    <div><label>Location</label><p id="fPlace"></p></div>
    <div><label>Date</label><p class="n" id="fDate"></p></div>
    <div><label>More info</label><p><a id="fUri" href="#" target="_blank" rel="noopener">iNaturalist ↗</a></p></div>
  </footer>
</div>

<script>
const CONFIG = {
  ownerName: 'Jonáš Gruska',
  subtitle: '(Mostly) lichen photography',
  // HTML allowed (links). Keep it to <a>, <b>, <i>, <br>.
  aboutHtml: 'My name is Jonáš. For over seven years I\'ve been photographing fungi, lichens, slime molds and small animals around the world. I specialize in lichens and have published <a href="https://jonasgru.sk/mycology" target="_blank" rel="noopener">two books</a> about them, featuring many of these photographs. Every photo here is my own and is <a href="mailto:jonas@lom.audio">available on request</a>. More about my mycological and lichenological work is on <a href="https://jonasgru.sk/mycology" target="_blank" rel="noopener">my main site</a>. For an unfiltered list of my observations, see my <a href="https://www.inaturalist.org/people/jonasgruska" target="_blank" rel="noopener">iNaturalist profile</a>.',
  email: 'jonas@lom.audio',
  equipment: [
    'Sony α7R V',
    'Sony FE 50mm F2.8 Macro',
    'Sony FE 90mm F2.8 Macro G OSS',
    'Sony FE 100mm F2.8 Macro GM OSS',
    'Sony FE 70-200mm F4 Macro G OSS II',
    'Sony FE 1.4x and 2.0x teleconverters',
    'Godox V1 Pro flash with Popeshield diffuser',
    'DIY custom focus stacking jig',
    'DIY UV light for attracting night insects',
    'Leofoto tripods',
  ],
  inatUser: 'jonasgruska',
  intervalSec: 10,
  indexUrl: 'data/index.json',
  preloadAhead: 3,   // how many upcoming photos to fetch in advance
  preloadBehind: 1,
};

const $ = (id) => document.getElementById(id);
const dash = (v) => v || '—';
const state = { items: [], cats: [], cat: 'All', idx: 0, view: 'slides', galleryView: 'slides', paused: false, timer: null, fallback: false, tag: '' };
const cache = new Map();          // url -> Image (keeps decoded images alive)
const CACHE_MAX = 24;

// ---- image sizes -------------------------------------------------------
// iNaturalist serves: square 75, thumb 100, small 240, medium 500, large 1024, original ≤2048.
function stageSize() {
  const px = Math.max(window.innerWidth, window.innerHeight) * Math.min(window.devicePixelRatio || 1, 2);
  return px > 1300 ? 'original' : 'large';
}
const photoUrl = (p, size) => `${p.base}/${size}.${p.ext}`;
const stageUrl = (o) => photoUrl(o.photos[0], stageSize());
const thumbUrl = (o) => photoUrl(o.photos[0], 'medium');

function preload(url) {
  if (cache.has(url)) return cache.get(url);
  const im = new Image();
  im.decoding = 'async';
  im.src = url;
  cache.set(url, im);
  if (cache.size > CACHE_MAX) cache.delete(cache.keys().next().value); // drop oldest
  return im;
}
function preloadAround(list, i) {
  if (!list.length) return;
  for (let d = 1; d <= CONFIG.preloadAhead; d++) preload(stageUrl(list[(i + d) % list.length]));
  for (let d = 1; d <= CONFIG.preloadBehind; d++) preload(stageUrl(list[(i - d + list.length) % list.length]));
}

// ---- data --------------------------------------------------------------
async function load() {
  try {
    const r = await fetch(CONFIG.indexUrl, { cache: 'no-cache' });
    const idx = await r.json();
    state.items = idx.items;
    state.cats = idx.categories;
    state.fallback = !!idx.fallback;
    state.tag = idx.tag;
  } catch (e) {
    state.items = []; state.cats = [];
  }
  $('loading').hidden = true;
  $('tagName').textContent = state.tag || 'Portfolio';
  readHash();
  renderCats();
  show(state.idx, true);
  setView(state.view);
}

const visible = () => state.cat === 'All' ? state.items : state.items.filter(o => o.cat === state.cat);

// ---- routing (shareable URLs) -----------------------------------------
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  const cat = h.get('cat');
  if (cat && (cat === 'All' || state.cats.some(c => c.name === cat))) state.cat = cat;
  const view = h.get('view');
  if (['slides', 'grid', 'about', 'contact'].includes(view)) state.view = view;
  const id = parseInt(h.get('id'), 10);
  if (id) { const i = visible().findIndex(o => o.id === id); if (i >= 0) state.idx = i; }
}
function writeHash() {
  const h = new URLSearchParams();
  if (state.cat !== 'All') h.set('cat', state.cat);
  if (state.view !== 'slides') h.set('view', state.view);
  const cur = visible()[state.idx];
  if (cur && state.view === 'slides') h.set('id', cur.id);
  const s = h.toString();
  history.replaceState(null, '', s ? '#' + s : location.pathname);
}

// ---- rendering ---------------------------------------------------------
function renderCats() {
  const nav = $('cats'); nav.innerHTML = '';
  const all = [{ name: 'All', count: state.items.length }, ...state.cats];
  for (const c of all) {
    const b = document.createElement('button');
    b.innerHTML = `${c.name} <small>${c.count}</small>`;
    b.classList.toggle('on', c.name === state.cat);
    b.onclick = () => {
      state.cat = c.name; state.idx = 0; renderCats();
      if (state.view === 'about' || state.view === 'contact') setView(state.galleryView);
      show(0); if (state.view === 'grid') renderGrid();
    };
    nav.appendChild(b);
  }
}

function renderFooter() {
  const list = visible(), cur = list[state.idx];
  const showF = !!cur && state.view === 'slides';
  $('footer').hidden = !showF;
  if (cur) {
    $('fLatin').textContent = cur.latin;
    $('fEn').textContent = dash(cur.en);
    $('fSk').textContent = dash(cur.sk);
    $('fPlace').textContent = dash(cur.place);
    $('fDate').textContent = cur.date ? new Date(cur.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '—';
    $('fUri').href = `https://www.inaturalist.org/observations/${cur.id}`;
    $('fUri').textContent = state.fallback ? 'iNaturalist ↗ (untagged preview)' : 'iNaturalist ↗';
  }
  const c = $('counter');
  if (!cur) { c.innerHTML = ''; return; }
  c.innerHTML = state.view === 'grid' ? `<span>${list.length}</span>` :
    `<span>${state.idx + 1} / ${list.length}</span><button id="btnPause" aria-label="Play/pause">${state.paused ? '▶' : '❚❚'}</button>`;
  const bp = $('btnPause'); if (bp) bp.onclick = togglePause;
}

function show(idx, instant) {
  const list = visible();
  const stage = $('stage');
  $('empty').hidden = !!list.length;
  if (!list.length) { stage.innerHTML = ''; state.idx = 0; renderFooter(); return; }
  const i = (idx + list.length) % list.length;
  state.idx = i;
  const o = list[i];
  const url = stageUrl(o);

  for (const l of stage.querySelectorAll('.layer:not(.out)')) { l.classList.add('out'); setTimeout(() => l.remove(), 1400); }
  const layer = document.createElement('div');
  layer.className = 'layer' + (instant ? ' instant' : '');
  const bg = document.createElement('img'); bg.className = 'bg'; bg.alt = ''; bg.setAttribute('aria-hidden', 'true');
  const fg = document.createElement('img'); fg.className = 'fg'; fg.alt = o.latin;
  bg.src = fg.src = url;
  layer.append(bg, fg);
  stage.appendChild(layer);
  preload(url);

  // pre-cache neighbours once the current one has arrived (so it isn't competing for bandwidth)
  const go = () => preloadAround(list, i);
  if (fg.complete) go(); else { fg.onload = go; fg.onerror = go; }

  renderFooter(); writeHash(); arm();
}
const step = (d) => show(state.idx + d);
function arm() {
  clearTimeout(state.timer);
  if (!state.paused && state.view === 'slides' && visible().length > 1) state.timer = setTimeout(() => step(1), CONFIG.intervalSec * 1000);
}
function togglePause() { state.paused = !state.paused; renderFooter(); arm(); }

function renderGrid() {
  const cells = $('cells'); cells.innerHTML = '';
  visible().forEach((o, i) => {
    const b = document.createElement('button');
    const im = document.createElement('img'); im.src = thumbUrl(o); im.alt = o.latin; im.loading = 'lazy';
    const s = document.createElement('span'); s.textContent = o.latin;
    b.append(im, s);
    b.onclick = () => { setView('slides'); show(i, true); };
    cells.appendChild(b);
  });
}

function setView(view) {
  state.view = view;
  if (view === 'slides' || view === 'grid') state.galleryView = view;
  for (const v of ['slides', 'grid', 'about', 'contact']) $(v).hidden = v !== view;
  $('btnSlides').classList.toggle('on', view === 'slides');
  $('btnGrid').classList.toggle('on', view === 'grid');
  $('btnAbout').classList.toggle('on', view === 'about');
  $('btnContact').classList.toggle('on', view === 'contact');
  $('btnHome').classList.toggle('on', false);
  $('empty').hidden = view !== 'slides' && view !== 'grid' || !!visible().length;
  if (view === 'grid') renderGrid();
  renderFooter(); writeHash(); arm();
}

// ---- wiring ------------------------------------------------------------
$('ownerName').textContent = CONFIG.ownerName;
$('subtitle').textContent = CONFIG.subtitle;
$('aboutText').innerHTML = CONFIG.aboutHtml;
for (const e of CONFIG.equipment || []) { const li = document.createElement('li'); li.textContent = e; $('equipment').appendChild(li); }
$('mail').textContent = CONFIG.email; $('mail').href = 'mailto:' + CONFIG.email;
$('inatLink').href = `https://www.inaturalist.org/people/${CONFIG.inatUser}`;
$('btnHome').onclick = () => setView('slides');
$('btnSlides').onclick = () => setView('slides');
$('btnGrid').onclick = () => setView('grid');
$('btnAbout').onclick = () => setView('about');
$('btnContact').onclick = () => setView('contact');
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
window.addEventListener('keydown', (e) => {
  if (state.view !== 'slides') return;
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
});
// touch swipe on the stage
let tx = null;
$('slides').addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
$('slides').addEventListener('touchend', (e) => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); });
window.addEventListener('hashchange', () => { readHash(); renderCats(); setView(state.view); show(state.idx, true); });

load();
</script>
</body>
</html>
