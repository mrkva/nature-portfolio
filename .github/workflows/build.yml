name: Build index & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # daily, refresh the index from iNaturalist
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/index.json from iNaturalist
        run: python3 scripts/build_index.py
      - name: Assemble site (only what the browser needs)
        run: |
          mkdir -p _site/data
          cp index.html robots.txt sitemap.xml google28868449777b28ca.html .nojekyll _site/
          cp data/index.json _site/data/
          cp -R img _site/img
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
