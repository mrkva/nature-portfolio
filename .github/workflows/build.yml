name: Build index & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # daily, refresh the index from iNaturalist
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Optional: with the INAT_OAUTH_TOKEN secret set, the "remove" list in data/curation.json
      # is applied to iNaturalist (Portfolio tag stripped) and the pruned file committed back.
      - name: Apply curation to iNaturalist
        env:
          INAT_OAUTH_TOKEN: ${{ secrets.INAT_OAUTH_TOKEN }}
        run: |
          if [ -z "$INAT_OAUTH_TOKEN" ]; then echo "INAT_OAUTH_TOKEN not set — skipping (run scripts/apply_curation.py locally)"; exit 0; fi
          JWT=$(curl -sf -H "Authorization: Bearer $INAT_OAUTH_TOKEN" https://www.inaturalist.org/users/api_token | python3 -c 'import json,sys; print(json.load(sys.stdin)["api_token"])')
          INAT_API_TOKEN="$JWT" python3 scripts/apply_curation.py
          if ! git diff --quiet data/curation.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Prune applied curation" data/curation.json
            git push
            echo "tags changed — waiting for iNaturalist's search index before building"; sleep 90
          fi
      - name: Build data/index.json from iNaturalist
        run: python3 scripts/build_index.py
      - name: Assemble site (only what the browser needs)
        run: |
          mkdir -p _site/data
          cp index.html robots.txt sitemap.xml google28868449777b28ca.html .nojekyll _site/
          cp data/index.json _site/data/
          cp data/curation.json _site/data/ 2>/dev/null || echo '{"remove":[],"hide":[]}' > _site/data/curation.json
          cp -R img _site/img
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
